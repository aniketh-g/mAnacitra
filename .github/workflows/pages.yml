name: Build and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 jq gdal-bin make curl

      - name: Install Rust for Sanskrit generation
        uses: dtolnay/rust-toolchain@stable

      - name: Download geography
        run: make download-cities download-countries download-rivers

      - name: Build website data
        run: make -B cities countries rivers rules

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4