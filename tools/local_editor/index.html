<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mānacitra · Local editor</title><link rel="stylesheet" href="/style.css"></head><body>
<header><strong>मानचित्रम् <small>Editor</small></strong><span>Edit source JSON and submits for review</span></header>
<main><aside><label>Dataset<select id="dataset"><option value="countries">Countries</option><option value="cities">Cities</option><option value="rivers">Rivers</option></select></label><label>Find a record<input id="filter" type="search" placeholder="Name or identifier"></label><button id="new-record">Add record</button><nav id="records" aria-label="Place records"></nav></aside>

<script src="/inspector-graph.js"></script><script src="/app.js"></script></body></html>
