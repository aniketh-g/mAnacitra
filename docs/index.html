<!DOCTYPE html>
<html lang="sa">
<head>
  <meta charset="utf-8" />
  <title>मानचित्रम्</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="inspectors.css" />
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="mobile-panels.css" />
  <link rel="stylesheet" href="place-search.css" />
</head>
<body>
<header>
  <h1>मानचित्रम्</h1>
  <div id="place-search" role="search">
    <span class="place-search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></span>
    <input id="place-search-input" type="search" placeholder="नाम अन्विष्यताम् - 'दानवी', 'DĀNVBIVS', उत 'दानुब्युस्' "
      aria-label="Search place names" role="combobox" aria-autocomplete="list"
      aria-expanded="false" aria-controls="place-search-results" autocomplete="off" spellcheck="false" />
    <button id="place-search-clear" type="button" aria-label="Clear search" hidden>×</button>
    <ul id="place-search-results" role="listbox" aria-label="Matching places" hidden></ul>
    <div id="place-search-status" role="status" aria-live="polite"></div>
  </div>
  <nav>
    <a href="index.html" class="active">मानचित्रम्</a>
    <a href="about.html">अस्मद्विषये</a>
    <a href="feedback.html">प्रतिमन्त्रणम्</a>
  </nav>
</header>

<main>
  <div id="map"></div>
</main>

<aside id="sidebar" aria-labelledby="sb-title" inert>
  <button id="sheet-handle" class="sheet-handle" type="button"
          aria-label="Expand place overview" aria-expanded="false" aria-controls="sb-names">
    <span aria-hidden="true"></span>
  </button>
  <button class="sidebar-close" onclick="closeSidebar()"
          aria-label="Close sidebar">×</button>

  <div class="sidebar-content">
    <div class="place-introduction">
      <h2 id="sb-title" lang="sa"></h2>
      <div id="sb-families" class="name-families"></div>
      <div id="sb-description" class="prose"></div>
    </div>

    <section class="sanskrit-section" aria-labelledby="sb-names-heading">
      <h3 id="sb-names-heading">नामान्तराणि विवरणानि च</h3>
      <ol id="sb-names"></ol>
    </section>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/marked@15/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="place-search.js"></script>
<script>

  let highlightedCountry = null;
  let highlightedCity = null;
  let highlightedRiver = null;

  function readArray(value) {
  if (Array.isArray(value)) return value;
  if (!value) return [];
  const parsed = JSON.parse(value);
  return Array.isArray(parsed) ? parsed : [];
}

function markdown(text = "") {
  // Also accommodate literal \n sequences in your existing notes.
  const source = String(text).replace(/\\n/g, "\n");
  return DOMPurify.sanitize(
    marked.parse(source, { breaks: true }),
    { USE_PROFILES: { html: true } }
  );
}

function addProse(parent, text, className = "") {
  if (!text) return;
  const div = document.createElement("div");
  div.className = `prose ${className}`;
  div.innerHTML = markdown(text);
  parent.append(div);
}

function attestationStatusText(record) {
  const status = record.attestation_status;
  if (status === 'newly_proposed') return 'निर्मापितं पदम्। न रूढिर्विद्यते। प्रयोगा अर्वाचीनाः।';
  return typeof status === 'string' ? status.trim() : '';
}

function addCitations(parent, citations = [], {locatorSeparator = ' — '} = {}) {
  if (!citations.length) return;

  const list = document.createElement("ul");
  list.className = "name-citations prose";

  for (const citation of citations) {
    const item = document.createElement("li");
    const label = citation.title || citation.source_id || "Source";
    let url;

    try {
      const candidate = new URL(citation.url);
      if (["http:", "https:"].includes(candidate.protocol)) {
        url = candidate.href;
      }
    } catch {}

    if (url) {
      const link = document.createElement("a");
      link.href = url;
      link.textContent = label;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      item.append(link);
    } else {
      item.append(document.createTextNode(label));
    }

    if (citation.locator) {
      item.append(document.createTextNode(`${locatorSeparator}${citation.locator}`));
    }


    addProse(item, citation.note || citation.comment);
    list.append(item);
  }

  parent.append(list);
}

let currentOverviewKey = null;
function openSidebar(props, placeKey) {
  const sidebar = document.getElementById('sidebar');

  if (
    placeKey === currentOverviewKey &&
    sidebar.classList.contains('open')
  ) {
    return;
  }

  if (placeKey !== currentOverviewKey) {
    NameInspectors.closeAll();
  }

  currentOverviewKey = placeKey;
  window.MobileOverview?.reset();

  const names = readArray(props.names_sanskrit);
  const primary = names.find(name => name.primary);
  const families = readArray(props.name_families);

  document.getElementById("sb-title").textContent =
    primary?.name || "नाम न निर्धारितम्";

  const pills = document.getElementById("sb-families");
  pills.replaceChildren();

  for (const family of families) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "family-pill";
    button.textContent = family.label;
    button.addEventListener("click", () => NameInspectors.open("foreign", family, button));
    pills.append(button);
  }

  document.getElementById("sb-description").innerHTML =
    markdown(props.description || "");

  const list = document.getElementById("sb-names");
  list.replaceChildren();

  // Preserve the authored order, including the preferred name.
  for (const name of names) {
    if (!name.name) continue;

    const item = document.createElement("li");
    const heading = document.createElement("h4");
    heading.className = "sanskrit-name";

    const button = document.createElement("button");
    button.type = "button";
    button.lang = "sa";
    button.textContent = name.name;
    button.addEventListener("click", () => NameInspectors.open("sanskrit", name, button));
    heading.append(button);
    item.append(heading);
    const status = attestationStatusText(name);
    if (status) {
      const note = document.createElement('p');
      note.className = 'attestation-status'; note.textContent = status;
      item.append(note);
    }

    const etymologies = name.etymologies || [];
    const multipleEtymologies = etymologies.length > 1;
    const etymologyList = multipleEtymologies ? document.createElement('ol') : item;
    if (multipleEtymologies) {
      etymologyList.className = 'overview-etymologies';
      item.append(etymologyList);
    }
    for (const etymology of etymologies) {
      const entry = document.createElement(multipleEtymologies ? 'li' : 'div');
      entry.className = 'etymology';
      addProse(entry, etymology.vyutpatti, 'vyutpatti');
      addProse(entry, etymology.notes);
      addCitations(entry, etymology.citations || []);
      etymologyList.append(entry);
    }

    // Keep existing entries visible during migration.
    if (!name.etymologies) {
      addProse(item, name.vyutpatti, "vyutpatti");
      addProse(item, name.context ?? name.notes);
      addCitations(item, name.citations || []);
    }

    list.append(item);
  }

  sidebar.inert = false;
  sidebar.classList.add("open");
  sidebar.querySelector(".sidebar-close").focus({ preventScroll: true });
}

  function closeSidebar() {
    selectedMapLabel = null;
    hoveredMapLabel = null;
    updateMapLabelColours();
    window.NameInspectors?.closeAll();
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebar").inert = true;
    map.getCanvas().focus({ preventScroll: true });
    map.setFilter('countries-fill', ['==', ['get', 'ADM0_A3'], '']);
    map.setFilter('capital-highlight', ['==', ['get', 'ADM0_A3'], '']);
    map.setFilter('rivers-highlight', ['==', ['get', 'name'], '']);
  }

  // HarfBuzz/PGF shaping trial. API signature matches MapLibre 3.6.2.
  maplibregl.setRTLTextPlugin(
    'https://wipfli.github.io/maplibre-gl-complex-text/dist/maplibre-gl-complex-text.js',
    error => { if (error) console.error('Devanagari shaping failed:', error); },
    false
  );
  const shapedGlyphRanges = new Set([
    63488, 63232, 62976, 62720, 62464, 62208, 61952, 61696,
    61440, 61184, 60928, 60672, 60416, 60160, 59904, 59648,
    59392, 59136, 58880, 58624, 58368, 58112, 57856, 57600,
    3072, 2816, 2560, 2304, 10240, 10752
  ]);
  const map = new maplibregl.Map({
    transformRequest(url, resourceType) {
      if (resourceType === 'Glyphs') {
        const match = url.match(/(\d+)-(\d+)\.pbf$/);
        if (match && shapedGlyphRanges.has(Number(match[1]))) {
          return {url: `https://wipfli.github.io/pgf-glyph-ranges/font/NotoSansMultiscript-Regular-v1/${match[1]}-${match[2]}.pbf`};
        }
      }
      return {url};
    },
    container: 'map',
    style: {
      version: 8,
      glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
      sources: { 
        basemap: { 
          type: 'raster', 
          tiles: ['https://a.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png?key=cb1_4lxi_1_09f8e55e794590ba1750f50f',
                  'https://b.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png?key=cb1_4lxi_1_09f8e55e794590ba1750f50f',
                  'https://c.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png?key=cb1_4lxi_1_09f8e55e794590ba1750f50f',
                ], 
          tileSize: 256 
        } 
      },
      layers: [ { id: 'basemap', type: 'raster', source: 'basemap' } ]
    },
    center: [0, 20],
    zoom: 2
  });

  let searchMapReady = false;
  const searchDatasets = new Map();
  map.on('load', async () => {
    map.addSource('cities', {
      type: 'geojson',
      data: 'data/cities.geojson'
    });
    
    map.addSource('rivers', {
      type: 'geojson',
      data: 'data/rivers.geojson'
    });

    const response = await fetch('data/countries.geojson');
    if (!response.ok) {
      throw new Error(`Could not load countries: ${response.status}`);
    }
    const countries = await response.json();
    searchDatasets.set("countries", Promise.resolve(countries));

    map.addSource('countries', {
      type: 'geojson',
      data: countries,
      generateId: true
    });

    map.addSource('country-label-points', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: countries.features.map(feature => ({
          type: 'Feature',
          properties: feature.properties,
          geometry: {
            type: 'Point',
            coordinates: [
              feature.properties.LABEL_X,
              feature.properties.LABEL_Y
            ]
          }
        }))
      }
    });

    // Deśāḥ
    map.addLayer({
      id: 'countries-fill',
      type: 'fill',
      source: 'countries',
      paint: {
        'fill-color': 'rgba(146,119,70,0.22)',
      },
      filter: ['==', ['get', 'ADM0_A3'], ''] // nothing selected initially
    });
    map.addLayer({
      id: 'countries-outline',
      type: 'line',
      source: 'countries',
      paint: {
        'line-color': '#999',
        'line-width': 1
      }
    });
    map.addLayer({
      id: 'countries-label',
      type: 'symbol',
      source: 'country-label-points',
      filter: ['all',
        ['>=', ['zoom'], ['coalesce', ['get', 'MIN_LABEL'], ['get', 'MIN_ZOOM'], 0]],
        ['<', ['zoom'], ['coalesce', ['get', 'MAX_LABEL'], 24]]
      ],
      layout: {
        'text-field': ['get', 'NAME_SA'],
        'text-font': ['Noto Sans Devanagari Regular v1'],
        'text-size': ['interpolate', ['linear'], ['zoom'],
                      2, 10,
                      5, 14,
                      8, 18],
        'symbol-sort-key': ['coalesce', ['get', 'LABELRANK'], 99],
        'text-padding': 4,
        'text-anchor': 'center',
        'text-allow-overlap': false,
        'symbol-placement': 'point'
      },
      paint: {
        'text-color': '#292822',
        'text-halo-color': '#fffefa',
        'text-halo-width': 1
      }
    });

    // Cities: Natural Earth zoom thresholds; capital rings remain distinctive.
    map.addLayer({
      id: 'capital-circles',
      type: 'circle',
      source: 'cities',
      filter: ['all',
        ['>=', ['zoom'], ['coalesce', ['get', 'MIN_ZOOM'], 7]],
        ['match', ['get', 'FEATURECLA'], ['Admin-0 capital', 'Admin-0 capital alt'], true, false]
      ],
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'],
                      3, 2,
                      5, 3],
        'circle-color': '#fff',
        'circle-stroke-color': '#000',
        'circle-stroke-width': 2
      }
    });
    map.addLayer({
      id: 'capital-dot',
      type: 'circle',
      source: 'cities',
      filter: ['>=', ['zoom'], ['coalesce', ['get', 'MIN_ZOOM'], 7]],
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'],
                      3, 1,
                      5, 2],
        'circle-color': '#000'
      }
    });
    map.addLayer({
      id: 'capital-highlight',
      type: 'circle',
      source: 'cities',
      paint: {
        'circle-radius': 6,
        'circle-color': '#c9ad70',
        'circle-stroke-color': '#000',
        'circle-stroke-width': 2
      },
      filter: ['==', ['get', 'ADM0_A3'], ''] // empty initially
    });
    map.addLayer({
      id: 'capital-labels-sa',
      type: 'symbol',
      source: 'cities',
      filter: ['>=', ['zoom'], ['coalesce', ['get', 'MIN_ZOOM'], 7]],
      layout: {
        'text-field': ['get', 'NAME_SA'],
        'text-font': ['Noto Sans Devanagari Regular v1'],
        'text-size': ['interpolate', ['linear'], ['zoom'],
                      3, 8,
                      5, 12,
                      8, 16],
        'symbol-sort-key': ['coalesce', ['get', 'SCALERANK'], ['get', 'LABELRANK'], 99],
        'text-variable-anchor': ['bottom', 'top', 'left', 'right'],
        'text-radial-offset': 0.8,
        'text-padding': 3,
        'text-allow-overlap': false
      },
      paint: {
        'text-color': '#292822',
        'text-halo-color': '#fffefa',
        'text-halo-width': 1
      }
    });

    // Saritaḥ
    map.addLayer({
      id: 'rivers-line',
      type: 'line',
      source: 'rivers',
      filter: ['>=', ['zoom'], ['coalesce', ['get', 'min_zoom'], 4]],
      paint: {
        'line-color': 'rgba(56, 179, 208, 0.5)',   // river blue
        'line-width': 1.2
      }
    });
    map.addLayer({
      id: 'rivers-highlight',
      type: 'line',
      source: 'rivers',
      paint: {
        'line-color': 'rgba(56, 179, 208, 0.9)',
        'line-width': 3
      },
      filter: ['==', ['get', 'ADM0_A3'], ''] // nothing selected
    });
    map.addLayer({
      id: 'rivers-labels',
      type: 'symbol',
      source: 'rivers',
      filter: ['>=', ['zoom'], ['max',
        ['coalesce', ['get', 'min_zoom'], 4],
        ['coalesce', ['get', 'min_label'], ['get', 'min_zoom'], 4]
      ]],
      layout: {
        'text-field': ['get', 'NAME_SA'], // use the river name property
        'text-font': ['Noto Sans Devanagari Regular v1'], // or Shobhika/Noto Devanagari for Sanskrit names
        'text-size': 14,
        'symbol-sort-key': ['coalesce', ['get', 'scalerank'], 99],
        'symbol-spacing': 500,
        'text-padding': 3,
        'text-allow-overlap': false,
        'symbol-placement': 'line',       // aligns text along river path
        'text-rotation-alignment': 'map',
        'text-keep-upright': true
      },
      paint: {
        'text-color': '#38b3d0',
        'text-halo-color': '#fffefa',
        'text-halo-width': 1
      }
    });

    searchMapReady = true;
  });

  // Clicking Logic
  const clickableLayers = ['countries-label', 'capital-labels-sa', 'rivers-labels'];

  let hoveredMapLabel = null;
  let selectedMapLabel = null;
  const mapPlaceKey = props => String(props.name_record_id || props.place_id || '');

  function updateMapLabelColours() {
    const featureKey = ['to-string', ['coalesce', ['get', 'name_record_id'], ['get', 'place_id'], '']];
    for (const layer of clickableLayers) {
      if (!map.getLayer(layer)) continue;
      const selected = selectedMapLabel?.layer === layer ? selectedMapLabel.key : null;
      const hovered = hoveredMapLabel?.layer === layer ? hoveredMapLabel.key : null;
      const colours = layer === 'rivers-labels'
        ? {normal: '#38b3d0', hover: '#79d2e5', selected: '#247f98'}
        : {normal: '#292822', hover: '#927746', selected: '#695028'};
      map.setPaintProperty(layer, 'text-color', [
        'case',
        selected === null ? false : ['==', featureKey, selected], colours.selected,
        hovered === null ? false : ['==', featureKey, hovered], colours.hover,
        colours.normal
      ]);
    }
  }
  clickableLayers.forEach(layer => {
    map.on('mousemove', layer, event => {
      const feature = event.features?.[0];
      if (!feature) return;
      map.getCanvas().style.cursor = 'pointer';
      const key = mapPlaceKey(feature.properties);
      if (hoveredMapLabel?.layer === layer && hoveredMapLabel.key === key) return;
      hoveredMapLabel = {layer, key};
      updateMapLabelColours();
    });
    map.on('mouseleave', layer, () => {
      if (hoveredMapLabel?.layer !== layer) return;
      hoveredMapLabel = null;
      map.getCanvas().style.cursor = '';
      updateMapLabelColours();
    });
  });
  // Close Sidebar
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;

    if (NameInspectors.closeAll()) {
      document.querySelector('.sidebar-close')
        ?.focus({ preventScroll: true });
    } else {
      closeSidebar();
    }
  });


  map.on('click', (e) => {
    const features = map.queryRenderedFeatures(e.point, { layers: clickableLayers });
    if (!features.length) return;

    const feature = features[0];
    selectPlace(feature.properties, feature.layer.id);
  });

  function selectPlace(props, layer) {
    selectedMapLabel = {layer: layer, key: mapPlaceKey(props)};
    updateMapLabelColours();

    // CLEAR ALL HIGHLIGHTS
    map.setFilter('countries-fill', ['==', ['get', 'ADM0_A3'], '']);
    map.setFilter('capital-highlight', ['==', ['get', 'ADM0_A3'], '']);
    map.setFilter('rivers-highlight', ['==', ['get', 'name'], '']);

    // APPLY CORRECT HIGHLIGHT
    if (layer === 'countries-label') {
      map.setFilter('countries-fill', [
        '==',
        ['get', 'ADM0_A3'],
        props.ADM0_A3
      ]);
    }
    if (layer === 'capital-labels-sa') {
      map.setFilter('capital-highlight', [
        '==',
        ['get', 'NAME_SA'],
        props.NAME_SA
      ]);
    }
    if (layer === 'rivers-labels') {
      map.setFilter('rivers-highlight', [
        '==',
        ['get', 'NAME_SA'],
        props.NAME_SA
      ]);
    }

    // SIDEBAR (unchanged logic)
    openSidebar(props, `${layer}:${props.name_record_id || props.place_id}`);
  }
  PlaceSearch.init(async (entry, isCurrent) => {
    if (!searchMapReady) throw Error('Map is still loading');
    if (!searchDatasets.has(entry.dataset)) {
      const request = fetch(`data/${entry.dataset}.geojson`).then(response => {
        if (!response.ok) throw Error('Dataset unavailable'); return response.json();
      }).catch(error => { searchDatasets.delete(entry.dataset); throw error; });
      searchDatasets.set(entry.dataset, request);
    }
    const data = await searchDatasets.get(entry.dataset);
    if (!isCurrent()) return;
    const feature = data.features.find(feature => String(feature.properties.name_record_id || feature.properties.place_id) === entry.id);
    if (!feature) throw Error('Place missing');
    const layer = {countries:'countries-label', cities:'capital-labels-sa', rivers:'rivers-labels'}[entry.dataset];
    selectPlace(feature.properties, layer);
    const mobile = matchMedia('(max-width: 999px)').matches;
    const zoom = {countries:4, cities:8, rivers:6}[entry.dataset];
    map.easeTo({center:entry.center, zoom,
      offset: mobile ? [0, -map.getContainer().clientHeight / 4] : [220, 0],
      duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 700});
    document.querySelector('.sidebar-close')?.focus({preventScroll:true});
  });
</script>
<script src="inspector-graph.js"></script>
<script src="inspectors.js"></script>
<script src="header-nav.js"></script>
<script src="mobile-panels.js"></script>
</body>
</html>
