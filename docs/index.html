<!DOCTYPE html>
<html lang="sa">
<head>
  <meta charset="utf-8" />
  <title>मानचित्रम्</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="inspectors.css" />
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="mobile-panels.css" />
  <link rel="stylesheet" href="place-search.css" />
  <link rel="stylesheet" href="site-header.css" />
</head>
<body>
<header data-page="map"></header>
<script src="site-header.js"></script>

<main>
  <div id="map"></div>
</main>

<aside id="sidebar" aria-labelledby="sb-title" inert>
  <button id="sheet-handle" class="sheet-handle" type="button"
          aria-label="Expand place overview" aria-expanded="false" aria-controls="sb-names">
    <span aria-hidden="true"></span>
  </button>
  <button class="sidebar-close" onclick="closeSidebar()"
          aria-label="Close sidebar">×</button>

  <div class="sidebar-content">
    <div class="place-introduction">
      <div class="place-title-row">
        <h2 id="sb-title" lang="sa"></h2>
        <a id="suggest-place" class="suggest-place" aria-label="Edit place" title="परिष्कारं सूचनां वा अभिमन्त्रयताम्" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg>
        </a>
      </div>
      <div id="sb-families" class="name-families"></div>
      <div id="sb-description" class="prose"></div>
    </div>

    <section class="sanskrit-section" aria-labelledby="sb-names-heading">
      <h3 id="sb-names-heading">नामान्तराणि विवरणानि च</h3>
      <ol id="sb-names"></ol>
    </section>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/marked@15/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="place-search.js"></script>
<script>

  let highlightedCountry = null;
  let highlightedCity = null;
  let highlightedRiver = null;

  function readArray(value) {
  if (Array.isArray(value)) return value;
  if (!value) return [];
  const parsed = JSON.parse(value);
  return Array.isArray(parsed) ? parsed : [];
}

function markdown(text = "") {
  // Also accommodate literal \n sequences in your existing notes.
  const source = String(text).replace(/\\n/g, "\n");
  return DOMPurify.sanitize(
    marked.parse(source, { breaks: true }),
    { USE_PROFILES: { html: true } }
  );
}

function addProse(parent, text, className = "") {
  if (!text) return;
  const div = document.createElement("div");
  div.className = `prose ${className}`;
  div.innerHTML = markdown(text);
  parent.append(div);
}

function attestationStatusText(record) {
  const status = record.attestation_status;
  if (status === 'newly_proposed') return 'योगतः सिद्धं पदम्। न रूढिर्विद्यते। प्रयोगा अर्वाचीनाः।';
  return typeof status === 'string' ? status.trim() : '';
}

function addCitations(parent, citations = [], {locatorSeparator = ' — '} = {}) {
  if (!citations.length) return;

  const list = document.createElement("ul");
  list.className = "name-citations prose";

  for (const citation of citations) {
    const item = document.createElement("li");
    if (citation.type === 'passage') {
      item.className = 'citation-passage';
      const sourceHeading = (entry, label) => {
        const heading = document.createElement('div');heading.className = 'citation-heading';
        if(entry.source) addCitations(heading, [entry.source], {locatorSeparator:' '});
        const kind=document.createElement('span');kind.className='citation-kind';kind.textContent=' · '+label;heading.append(kind);
        return heading;
      };
      const quotation = (entry, label, host, withHeading=true) => {
        if (!entry) return;
        const section = document.createElement('section');section.className = 'citation-quotation';
        if(withHeading)section.append(sourceHeading(entry,label));
        if (entry.quote) {
          const quote = document.createElement('blockquote');quote.className = 'prose';quote.innerHTML = markdown(entry.quote);section.append(quote);
        }
        addProse(section, entry.notes);host.append(section);
      };
      for (const commentary of citation.commentaries || []) quotation(commentary, 'व्याख्या', item);
      if(citation.passage){
        const original=document.createElement('details');original.className='citation-original';
        const summary=document.createElement('summary');
        const collapsed=document.createElement('span');collapsed.className='citation-original-label';collapsed.textContent='मूलम्';
        const expanded=sourceHeading(citation.passage,'मूलम्');expanded.classList.add('citation-original-heading');
        summary.append(collapsed,expanded);original.append(summary);
        quotation(citation.passage,'मूलम्',original,false);item.append(original);
      }
      addProse(item, citation.note);
      list.append(item);continue;
    }
    const label = citation.title || citation.source_id || "Source";
    let url;

    try {
      const candidate = new URL(citation.url);
      if (["http:", "https:"].includes(candidate.protocol)) {
        url = candidate.href;
      }
    } catch {}

    if (url) {
      const link = document.createElement("a");
      link.href = url;
      link.textContent = label;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      item.append(link);
    } else {
      item.append(document.createTextNode(label));
    }

    if (citation.locator) {
      item.append(document.createTextNode(`${locatorSeparator}${citation.locator}`));
    }


    addProse(item, citation.note || citation.comment);
    list.append(item);
  }

  parent.append(list);
}

let currentOverviewKey = null;
function openSidebar(props, placeKey) {
  const sidebar = document.getElementById('sidebar');

  if (
    placeKey === currentOverviewKey &&
    sidebar.classList.contains('open')
  ) {
    return;
  }

  if (placeKey !== currentOverviewKey) {
    NameInspectors.closeAll();
  }

  currentOverviewKey = placeKey;
  window.MobileOverview?.reset();

  const names = readArray(props.names_sanskrit);
  const primary = names.find(name => name.primary);
  const families = readArray(props.name_families);

  document.getElementById("sb-title").textContent =
    primary?.name || "नाम न निर्धारितम्";

  const pills = document.getElementById("sb-families");
  pills.replaceChildren();

  for (const family of families) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "family-pill";
    button.textContent = family.label;
    button.addEventListener("click", () => NameInspectors.open("foreign", family, button));
    pills.append(button);
  }

  document.getElementById("sb-description").innerHTML =
    markdown(props.description || "");

  const list = document.getElementById("sb-names");
  list.replaceChildren();

  // Preserve the authored order, including the preferred name.
  for (const name of names) {
    if (!name.name) continue;

    const item = document.createElement("li");
    const heading = document.createElement("h4");
    heading.className = "sanskrit-name";

    const button = document.createElement("button");
    button.type = "button";
    button.lang = "sa";
    button.textContent = name.name;
    button.addEventListener("click", () => NameInspectors.open("sanskrit", name, button));
    heading.append(button);
    item.append(heading);
    const status = attestationStatusText(name);
    if (status) {
      const note = document.createElement('p');
      note.className = 'attestation-status'; note.textContent = status;
      item.append(note);
    }

    const etymologies = name.etymologies || [];
    const multipleEtymologies = etymologies.length > 1;
    const etymologyList = multipleEtymologies ? document.createElement('ol') : item;
    if (multipleEtymologies) {
      etymologyList.className = 'overview-etymologies';
      item.append(etymologyList);
    }
    for (const etymology of etymologies) {
      const entry = document.createElement(multipleEtymologies ? 'li' : 'div');
      entry.className = 'etymology';
      addProse(entry, etymology.vyutpatti, 'vyutpatti');
      addProse(entry, etymology.notes);
      addCitations(entry, etymology.citations || []);
      etymologyList.append(entry);
    }

    // Keep existing entries visible during migration.
    if (!name.etymologies) {
      addProse(item, name.vyutpatti, "vyutpatti");
      addProse(item, name.context ?? name.notes);
      addCitations(item, name.citations || []);
    }

    list.append(item);
  }

  sidebar.inert = false;
  sidebar.classList.add("open");
  sidebar.querySelector(".sidebar-close").focus({ preventScroll: true });
}

  function closeSidebar() {
    ++selectionRequest; activePlace = null; saveRoute();
    selectedMapLabel = null;
    hoveredMapLabel = null;
    updateMapLabelColours();
    window.NameInspectors?.closeAll();
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebar").inert = true;
    map.getCanvas().focus({ preventScroll: true });
    map.setFilter('countries-fill', ['==', ['get', 'ADM0_A3'], '']);
    map.setFilter('capital-highlight', ['==', ['get', 'ADM0_A3'], '']);
    map.setFilter('rivers-highlight', ['==', ['get', 'name'], '']);
  }

  // HarfBuzz/PGF shaping trial. API signature matches MapLibre 3.6.2.
  maplibregl.setRTLTextPlugin(
    'https://wipfli.github.io/maplibre-gl-complex-text/dist/maplibre-gl-complex-text.js',
    error => { if (error) console.error('Devanagari shaping failed:', error); },
    false
  );
  const shapedGlyphRanges = new Set([
    63488, 63232, 62976, 62720, 62464, 62208, 61952, 61696,
    61440, 61184, 60928, 60672, 60416, 60160, 59904, 59648,
    59392, 59136, 58880, 58624, 58368, 58112, 57856, 57600,
    3072, 2816, 2560, 2304, 10240, 10752
  ]);
  const map = new maplibregl.Map({
    transformRequest(url, resourceType) {
      if (resourceType === 'Glyphs') {
        const match = url.match(/(\d+)-(\d+)\.pbf$/);
        if (match && shapedGlyphRanges.has(Number(match[1]))) {
          return {url: `https://wipfli.github.io/pgf-glyph-ranges/font/NotoSansMultiscript-Regular-v1/${match[1]}-${match[2]}.pbf`};
        }
      }
      return {url};
    },
    container: 'map',
    style: {
      version: 8,
      glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
      sources: { 
        basemap: { 
          type: 'raster', 
          tiles: ['https://a.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png?key=cb1_4lxi_1_09f8e55e794590ba1750f50f',
                  'https://b.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png?key=cb1_4lxi_1_09f8e55e794590ba1750f50f',
                  'https://c.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png?key=cb1_4lxi_1_09f8e55e794590ba1750f50f',
                ], 
          // tiles: ['https://tiles.stadiamaps.com/tiles/stamen_terrain_background/{z}/{x}/{y}.png'],
          tileSize: 256 
        } 
      },
      layers: [ { id: 'basemap', type: 'raster', source: 'basemap' } ]
    },
    center: [0, 20],
    zoom: 2
  });

  // MapLibre keeps the compass aligned with bearing and resets north on click.
  map.addControl(new maplibregl.NavigationControl({
    showZoom: false, showCompass: true, visualizePitch: false
  }), 'bottom-right');

  let searchMapReady = false;
  const searchDatasets = new Map();
  const mapNotice=document.createElement('div');mapNotice.className='map-notice';mapNotice.setAttribute('role','status');document.body.append(mapNotice);
  let loadFailed=false;
  function notifyMap(text,retry){
    mapNotice.replaceChildren(document.createTextNode(text));mapNotice.hidden=false;
    if(retry){loadFailed=true;const b=document.createElement('button');b.textContent='पुनर्लम्भय';b.onclick=()=>{mapNotice.hidden=true;loadFailed=false;Promise.resolve().then(retry).catch(e=>{console.error(e);notifyMap(text,retry);});};mapNotice.append(b);}
  }
  window.retryPlaceLoad=(retry)=>notifyMap('देशादिविवरणानि न लब्धानि ',retry);
  notifyMap('मानचित्रं लम्भ्यमानम्...');
  map.on('error',e=>{console.error(e.error);notifyMap('केचन दत्तांशा न लब्धाः ',()=>location.reload());});
  map.on('load', async () => {
    try {
    map.addSource('cities', {
      type: 'geojson',
      data: 'data/cities.map.geojson'
    });
    
    map.addSource('rivers', {
      type: 'geojson',
      data: 'data/rivers.map.geojson'
    });

    const response = await fetch('data/countries.map.geojson');
    if (!response.ok) {
      throw new Error(`Could not load countries: ${response.status}`);
    }
    const countries = await response.json();
    searchDatasets.set("countries", Promise.resolve(countries));

    map.addSource('countries', {
      type: 'geojson',
      data: countries,
      generateId: true
    });

    map.addSource('country-label-points', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: countries.features.map(feature => ({
          type: 'Feature',
          properties: feature.properties,
          geometry: {
            type: 'Point',
            coordinates: [
              feature.properties.LABEL_X,
              feature.properties.LABEL_Y
            ]
          }
        }))
      }
    });

    // Deśāḥ
    map.addLayer({
      id: 'countries-fill',
      type: 'fill',
      source: 'countries',
      paint: {
        'fill-color': 'rgba(146,119,70,0.22)',
      },
      filter: ['==', ['get', 'ADM0_A3'], ''] // nothing selected initially
    });
    map.addLayer({
      id: 'countries-outline',
      type: 'line',
      source: 'countries',
      paint: {
        'line-color': '#999',
        'line-width': 1
      }
    });
    map.addLayer({
      id: 'countries-label',
      type: 'symbol',
      source: 'country-label-points',
      filter: ['all',
        ['>=', ['zoom'], ['coalesce', ['get', 'MIN_LABEL'], ['get', 'MIN_ZOOM'], 0]],
        ['<', ['zoom'], ['coalesce', ['get', 'MAX_LABEL'], 24]]
      ],
      layout: {
        'text-field': ['get', 'NAME_SA'],
        'text-font': ['Noto Sans Devanagari Regular v1'],
        'text-size': ['interpolate', ['linear'], ['zoom'],
                      2, 15,
                      5, 19,
                      8, 23],
        'symbol-sort-key': ['coalesce', ['get', 'LABELRANK'], 99],
        'text-padding': 4,
        'text-anchor': 'center',
        'text-allow-overlap': false,
        'symbol-placement': 'point'
      },
      paint: {
        'text-color': '#786038',
        'text-halo-color': '#fffefa',
        'text-halo-width': 1.4
      }
    });

    // Cities: Natural Earth zoom thresholds; capital rings remain distinctive.
    map.addLayer({
      id: 'capital-circles',
      type: 'circle',
      source: 'cities',
      filter: ['all',
        ['>=', ['zoom'], ['coalesce', ['get', 'MIN_ZOOM'], 7]],
        ['match', ['get', 'FEATURECLA'], ['Admin-0 capital', 'Admin-0 capital alt'], true, false]
      ],
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'],
                      3, 2,
                      5, 3],
        'circle-color': '#fff',
        'circle-stroke-color': '#786038',
        'circle-stroke-width': 2
      }
    });
    map.addLayer({
      id: 'capital-dot',
      type: 'circle',
      source: 'cities',
      filter: ['>=', ['zoom'], ['coalesce', ['get', 'MIN_ZOOM'], 7]],
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'],
                      3, 1,
                      5, 2],
        'circle-color': '#615b51'
      }
    });
    map.addLayer({
      id: 'capital-highlight',
      type: 'circle',
      source: 'cities',
      paint: {
        'circle-radius': 6,
        'circle-color': '#c9ad70',
        'circle-stroke-color': '#786038',
        'circle-stroke-width': 2
      },
      filter: ['==', ['get', 'ADM0_A3'], ''] // empty initially
    });
    map.addLayer({
      id: 'capital-labels-sa',
      type: 'symbol',
      source: 'cities',
      filter: ['>=', ['zoom'], ['coalesce', ['get', 'MIN_ZOOM'], 7]],
      layout: {
        'text-field': ['get', 'NAME_SA'],
        'text-font': ['Noto Sans Devanagari Regular v1'],
        'text-size': ['interpolate', ['linear'], ['zoom'],
                      3, ['case', ['match', ['get', 'FEATURECLA'], ['Admin-0 capital', 'Admin-0 capital alt'], true, false], 15, 12],
                      5, ['case', ['match', ['get', 'FEATURECLA'], ['Admin-0 capital', 'Admin-0 capital alt'], true, false], 18, 15],
                      8, ['case', ['match', ['get', 'FEATURECLA'], ['Admin-0 capital', 'Admin-0 capital alt'], true, false], 21, 18]],
        'symbol-sort-key': ['coalesce', ['get', 'SCALERANK'], ['get', 'LABELRANK'], 99],
        'text-variable-anchor': ['bottom', 'top', 'left', 'right'],
        'text-radial-offset': 0.8,
        'text-padding': 3,
        'text-allow-overlap': false
      },
      paint: {
        'text-color': ['case', ['match', ['get', 'FEATURECLA'], ['Admin-0 capital', 'Admin-0 capital alt'], true, false], '#493b27', '#615b51'],
        'text-halo-color': '#fffefa',
        'text-halo-width': 1
      }
    });

    // Saritaḥ
    map.addLayer({
      id: 'rivers-line',
      type: 'line',
      source: 'rivers',
      filter: ['>=', ['zoom'], ['coalesce', ['get', 'min_zoom'], 4]],
      paint: {
        'line-color': 'rgba(56, 179, 208, 0.5)',   // river blue
        'line-width': 1.2
      }
    });
    map.addLayer({
      id: 'rivers-highlight',
      type: 'line',
      source: 'rivers',
      paint: {
        'line-color': 'rgba(56, 179, 208, 0.9)',
        'line-width': 3
      },
      filter: ['==', ['get', 'ADM0_A3'], ''] // nothing selected
    });
    map.addLayer({
      id: 'rivers-labels',
      type: 'symbol',
      source: 'rivers',
      filter: ['>=', ['zoom'], ['max', 0, ['-', ['max',
        ['coalesce', ['get', 'min_zoom'], 4],
        ['coalesce', ['get', 'min_label'], ['get', 'min_zoom'], 4]
      ], 6]]],
      layout: {
        'text-field': ['get', 'NAME_SA'], // use the river name property
        'text-font': ['Noto Sans Devanagari Regular v1'], // or Shobhika/Noto Devanagari for Sanskrit names
        'text-size': 14,
        'symbol-sort-key': ['coalesce', ['get', 'scalerank'], 99],
        'symbol-spacing': 250,
        'text-padding': 3,
        'text-allow-overlap': true,
        'symbol-placement': 'line',       // aligns text along river path
        'text-rotation-alignment': 'map',
        'text-keep-upright': true
      },
      paint: {
        'text-color': '#38b3d0',
        'text-halo-color': '#fffefa',
        'text-halo-width': 1
      }
    });

    searchMapReady = true;
    if(!loadFailed)mapNotice.hidden=true;
    restoreRoute();
    } catch(error) {console.error(error);notifyMap("Map data could not load. ",()=>location.reload());}
  });

  // Clicking Logic
  const clickableLayers = ['countries-label', 'capital-labels-sa', 'rivers-labels'];

  let hoveredMapLabel = null;
  let selectedMapLabel = null;
  const mapPlaceKey = props => String(props.name_record_id || props.place_id || '');

  function updateMapLabelColours() {
    const featureKey = ['to-string', ['coalesce', ['get', 'name_record_id'], ['get', 'place_id'], '']];
    for (const layer of clickableLayers) {
      if (!map.getLayer(layer)) continue;
      const selected = selectedMapLabel?.layer === layer ? selectedMapLabel.key : null;
      const hovered = hoveredMapLabel?.layer === layer ? hoveredMapLabel.key : null;
      const colours = layer === 'rivers-labels'
        ? {normal: '#38b3d0', hover: '#79d2e5', selected: '#247f98'}
        : {normal: layer === 'countries-label' ? '#786038' : ['case', ['match', ['get', 'FEATURECLA'], ['Admin-0 capital', 'Admin-0 capital alt'], true, false], '#493b27', '#615b51'], hover: '#927746', selected: '#695028'};
      map.setPaintProperty(layer, 'text-color', [
        'case',
        selected === null ? false : ['==', featureKey, selected], colours.selected,
        hovered === null ? false : ['==', featureKey, hovered], colours.hover,
        colours.normal
      ]);
    }
  }
  clickableLayers.forEach(layer => {
    map.on('mousemove', layer, event => {
      const feature = event.features?.[0];
      if (!feature) return;
      map.getCanvas().style.cursor = 'pointer';
      const key = mapPlaceKey(feature.properties);
      if (hoveredMapLabel?.layer === layer && hoveredMapLabel.key === key) return;
      hoveredMapLabel = {layer, key};
      updateMapLabelColours();
    });
    map.on('mouseleave', layer, () => {
      if (hoveredMapLabel?.layer !== layer) return;
      hoveredMapLabel = null;
      map.getCanvas().style.cursor = '';
      updateMapLabelColours();
    });
  });
  // Close Sidebar
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;

    if (NameInspectors.closeAll()) {
      document.querySelector('.sidebar-close')
        ?.focus({ preventScroll: true });
    } else {
      closeSidebar();
    }
  });


  map.on('click', (e) => {
    const features = map.queryRenderedFeatures(e.point, { layers: clickableLayers });
    if (!features.length) return;

    const feature = features[0];
    const retry=()=>selectPlace(feature.properties, feature.layer.id);
    retry().catch(error=>{showLoadError(error);window.retryPlaceLoad(retry);});
  });

  const datasetsByLayer = {'countries-label':'countries','capital-labels-sa':'cities','rivers-labels':'rivers'};
  let selectionRequest=0, activePlace=null, restoring=false;
  const detailCache=new Map();
  function showLoadError(error) {
    console.error(error);
    document.getElementById('place-search-status').textContent='स्थानं न उद्घाटितम्। पुनः प्रयतस्व।';
  }
  const suggest=document.getElementById('suggest-place');
  function updateSuggest(){
    suggest.hidden=!(window.headerUser && activePlace && document.getElementById('sidebar').classList.contains('open'));
    if(activePlace)suggest.href='contribute/?'+new URLSearchParams({dataset:activePlace.dataset,id:activePlace.id});
  }
  window.addEventListener('site-user',updateSuggest);
  function saveRoute() {
    updateSuggest();
    if (restoring) return;
    const params=new URLSearchParams();
    if (activePlace) {
      params.set('place',activePlace.dataset+':'+activePlace.id);
      params.set('inspectors',JSON.stringify(window.NameInspectors?.snapshot() || []));
    }
    const hash=params.toString();
    if (location.hash.slice(1)!==hash) history.replaceState(null,'',location.pathname+location.search+(hash?'#'+hash:''));
  }
  window.addEventListener('inspectors-change',saveRoute);
  async function restoreRoute() {
    if (!searchMapReady) return;
    const params=new URLSearchParams(location.hash.slice(1)), place=params.get('place');
    if (!place) { closeSidebar(); return; }
    const colon=place.indexOf(':'), dataset=place.slice(0,colon), id=place.slice(colon+1);
    if (!['cities','countries','rivers'].includes(dataset)) return;
    restoring=true;
    try {
      const response=await fetch(`data/search/${dataset}.json`);
      if (!response.ok) throw Error('Search unavailable');
      const entry=(await response.json()).find(e=>e.id===id);
      if (!entry) throw Error('Place not found');
      await choosePlace(entry,()=>true);
      NameInspectors.closeAll();
      let inspectors=[];
      try { inspectors=JSON.parse(params.get('inspectors') || '[]'); } catch {}
      if (Array.isArray(inspectors)) NameInspectors.restore(inspectors.filter(x=>x && typeof x==='object'));
      await Promise.resolve();
    } catch(error) { showLoadError(error);window.retryPlaceLoad(restoreRoute); }
    finally { restoring=false; }
  }
  window.addEventListener('hashchange',restoreRoute);
  async function selectPlace(props, layer) {
    const request=++selectionRequest, dataset=datasetsByLayer[layer];
    if (!dataset) return;
    const id=String(props.name_record_id || props.place_id), key=dataset+':'+id;
    // The generated filename itself contains percent escapes; encode those for HTTP.
    const filename = encodeURIComponent(id).replace(/[!'()*]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase());
    if (!detailCache.has(key)) detailCache.set(key,fetch(`data/details/${dataset}/${encodeURIComponent(filename)}.json`).then(r=>{
      if (!r.ok) throw Error('Details unavailable'); return r.json();
    }).catch(e=>{detailCache.delete(key);throw e;}));
    const detail=await detailCache.get(key);
    if (request!==selectionRequest) return;
    props={...props,...detail};
    if(!loadFailed)mapNotice.hidden=true;
    activePlace={dataset,id};
    selectedMapLabel = {layer: layer, key: mapPlaceKey(props)};
    updateMapLabelColours();

    // CLEAR ALL HIGHLIGHTS
    map.setFilter('countries-fill', ['==', ['get', 'ADM0_A3'], '']);
    map.setFilter('capital-highlight', ['==', ['get', 'ADM0_A3'], '']);
    map.setFilter('rivers-highlight', ['==', ['get', 'name'], '']);

    // APPLY CORRECT HIGHLIGHT
    if (layer === 'countries-label') {
      map.setFilter('countries-fill', [
        '==',
        ['get', 'ADM0_A3'],
        props.ADM0_A3
      ]);
    }
    if (layer === 'capital-labels-sa') {
      map.setFilter('capital-highlight', [
        '==',
        ['get', 'NAME_SA'],
        props.NAME_SA
      ]);
    }
    if (layer === 'rivers-labels') {
      map.setFilter('rivers-highlight', [
        '==',
        ['get', 'NAME_SA'],
        props.NAME_SA
      ]);
    }

    // SIDEBAR (unchanged logic)
    openSidebar(props, `${layer}:${props.name_record_id || props.place_id}`);
    saveRoute();
  }
  async function choosePlace(entry, isCurrent) {
    if (!searchMapReady) throw Error('Map is still loading');
    if (!searchDatasets.has(entry.dataset)) {
      const request = fetch(`data/${entry.dataset}.map.geojson`).then(response => {
        if (!response.ok) throw Error('Dataset unavailable'); return response.json();
      }).catch(error => { searchDatasets.delete(entry.dataset); throw error; });
      searchDatasets.set(entry.dataset, request);
    }
    const data = await searchDatasets.get(entry.dataset);
    if (!isCurrent()) return;
    const feature = data.features.find(feature => String(feature.properties.name_record_id || feature.properties.place_id) === entry.id);
    if (!feature) throw Error('Place missing');
    const layer = {countries:'countries-label', cities:'capital-labels-sa', rivers:'rivers-labels'}[entry.dataset];
    await selectPlace(feature.properties, layer);
    if (!isCurrent()) return;
    const mobile = matchMedia('(max-width: 999px)').matches;
    const zoom = {countries:4, cities:8, rivers:6}[entry.dataset];
    map.easeTo({center:entry.center, zoom,
      offset: mobile ? [0, -map.getContainer().clientHeight / 4] : [220, 0],
      duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 700});
    document.querySelector('.sidebar-close')?.focus({preventScroll:true});
  }
  PlaceSearch.init(choosePlace);
</script>
